<!DOCTYPE html>

<body data-page="home">

  <header class="topbar">

          <span class="brand-name">STD App Store</span>

    </div>

    <div class="search-wrap">

        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

    </div>

    <div class="chips-wrap" id="chips-wrap">
      <a class="chip" data-cat="" href="index.html">All</a>
      <a class="chip" data-cat="app" href="index.html?cat=app">App</a>

    <a href="info.html?p=disclaimer">Disclaimer</a>

  <div class="overlay" id="overlay"></div>

  <main>

    <div id="app-list" class="app-list"></div>

  <nav class="bottom-nav">
